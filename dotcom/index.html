<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrioryWeb</title>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="struct.css">
</head>
<body>
    <header class="color-text disable-selection">
        <div class="title-bar hidden">
            <div class="title-text sans">PrioryWeb</div>
            <div class="inline-text normal-text">.com</div>
        </div>
        <div class="horizontal-spacer"></div>
        <div class="button-row">
            <button onclick="location.href='index.html'" class="header-button magnify-text color-block-hoverable light-text disable-selection disable-decoration hidden">Home</button>
            <a href="https://prioryca.org" class="title-text color-text disable-selection disable-decoration serif">Priory</a>
        </div>
    </header>
    <main>
        <div class="center-box">
            <div class="title-bar color-text disable-selection large-text">
                <div class="title-text sans">PrioryWeb</div>
                <div class="inline-text normal-text">.com</div>
            </div>
            <form class="search-box">
                <input type="text" name="q" placeholder="Search..." class="search-input color-text box-text">
                <button type="submit" class="search-button box-text">Search</button>
            </form>
        </div>
    </main>
    <footer>
        <!-- No footer exists on main page -->
    </footer>
</body>
</html>
